<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOCTIV Admin Login</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <div class="brand-panel">
        <img class="brand-logo" src="logo.svg" alt="" />
        <div>
          <p class="eyebrow">Managed productivity</p>
          <h1>LOCTIV</h1>
        </div>
        <p class="brand-copy">
          Secure company laptop governance, website blocking, and digital wellness enforcement.
        </p>
        <ul class="feature-list">
          <li>Scheduled website controls</li>
          <li>Employee and laptop management</li>
          <li>Support tickets and replacement workflow</li>
        </ul>
      </div>

      <form id="loginForm" class="login-card" novalidate>
        <div class="login-card-header">
          <p class="auth-label">Administrator access</p>
          <button type="button" class="icon-btn theme-toggle login-theme-toggle" id="loginThemeToggleBtn" aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
            <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.4A8.5 8.5 0 0 1 8.6 3.6 8.7 8.7 0 1 0 20.4 15.4Z"></path></svg>
          </button>
        </div>
        <h2>Sign in</h2>

        <label class="input-field">
          <span>Email</span>
          <input id="email" type="email" placeholder="name@company.com" required />
        </label>

        <label class="input-field">
          <span>Password</span>
          <div class="password-row">
            <input id="password" type="password" placeholder="Enter password" required />
            <button type="button" class="password-toggle eye-toggle-login" id="togglePassword" aria-label="Show password" aria-pressed="false"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
          </div>
        </label>

        <label class="checkbox-row">
          <input id="remember" type="checkbox" />
          <span>Remember me</span>
        </label>

        <button type="submit" class="primary-btn">Login</button>
        <a class="text-btn" href="extension-download.html">Download employee extension</a>
        <p id="loginError" class="error-text hidden"></p>
      </form>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  </body>
</html>
