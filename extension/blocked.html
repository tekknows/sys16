<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked by LOCTIV</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef4ff, #dfeafc);
        font-family: Inter, 'Segoe UI', sans-serif;
        color: #111827;
      }
      .card {
        max-width: 520px;
        background: white;
        border: 1px solid #dfeafc;
        border-radius: 18px;
        box-shadow: 0 18px 32px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }
      .badge {
        display: inline-block;
        background: rgba(37, 99, 235, 0.12);
        color: #2563eb;
        border-radius: 999px;
        padding: 6px 10px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 12px;
      }
      p {
        color: #4b5563;
        line-height: 1.6;
      }
      strong {
        color: #111827;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">LOCTIV</span>
      <h1>Access restricted</h1>
      <p>
        This website is currently blocked by your company productivity policy.
      </p>
      <p>
        Blocked website: <strong id="blockedWebsite">the requested site</strong>
      </p>
      <p>
        Reason: Company-managed schedule or policy restriction is active for this site.
      </p>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
